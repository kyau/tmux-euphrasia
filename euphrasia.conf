# Euphrasia palette, ported from the author's Xresources and Ghostty theme.
euphrasia_background="#090c19"
euphrasia_black="#1c2032"
euphrasia_foreground="#c0c0c0"
euphrasia_cursor="#e6e6e6"
euphrasia_bright_black="#808080"
euphrasia_red="#961414"
euphrasia_bright_red="#dc1216"
euphrasia_green="#1aaa13"
euphrasia_bright_green="#5dce33"
euphrasia_orange="#ff7f00"
euphrasia_bright_yellow="#fae32d"
euphrasia_blue="#3a57d7"
euphrasia_bright_blue="#507cff"
euphrasia_magenta="#9f106f"
euphrasia_bright_magenta="#e413c2"
euphrasia_cyan="#258f8f"
euphrasia_bright_cyan="#4dc5dc"
euphrasia_white="#ffffff"

# Custom hostname accent.
euphrasia_hostname="#73488b"

# Nerd Font glyphs.
nf_pill_open=""
nf_pill_close=""
nf_soft_right=""
nf_soft_left=""
nf_tab_inactive=""
nf_tab_active=""
nf_window=""
nf_hostname="󰛡"
nf_dots=""

# Core status-line settings. The single row keeps window information on the
# left, the window list centered, and prefix/host information on the right.
set -g status on
set -g status-interval 1
set -g status-position bottom
set -g status-style "bg=${euphrasia_background},fg=${euphrasia_foreground}"
set -g status-justify centre
set -g status-left ""
set -g status-right ""
set -g status-left-length 100
set -g status-right-length 100
set -g status-format[0] "#[align=left]#{E:@euphrasia_info_left}#[list=on align=#{status-justify}]#[fg=${euphrasia_black}]${nf_dots}  #[list=left-marker]<#[list=right-marker]>#[list=on]#{W:#{T:window-status-format},#{T:window-status-current-format}} #[fg=${euphrasia_black}]${nf_dots}#[nolist align=right]#{E:@euphrasia_info_right}"
set -gu status-format[1]

# Panes, modes, and messages.
set -g pane-border-style "fg=${euphrasia_black}"
set -g pane-active-border-style "fg=${euphrasia_bright_green}"
set -g display-panes-colour "${euphrasia_black}"
set -g display-panes-active-colour "${euphrasia_bright_green}"
setw -g clock-mode-colour "${euphrasia_bright_cyan}"
set -g message-style "fg=${euphrasia_background},bg=${euphrasia_orange}"
set -g message-command-style "fg=${euphrasia_background},bg=${euphrasia_orange}"

# tmux-prefix-highlight integration, when that plugin is installed.
set -g @prefix_highlight_fg "${euphrasia_background}"
set -g @prefix_highlight_bg "${euphrasia_bright_magenta}"
set -g @prefix_highlight_output_prefix "#[fg=${euphrasia_background},bg=${euphrasia_background}]"
set -g @prefix_highlight_output_suffix ""
set -g @prefix_highlight_copy_mode_attr "fg=${euphrasia_background},bg=${euphrasia_bright_magenta},bold"

# Centered window list. ANSI 1;36 maps to Euphrasia bright cyan.
set -g window-status-format "#[fg=${euphrasia_black},bg=${euphrasia_background}]${nf_pill_open}#[fg=${euphrasia_bright_black},bg=${euphrasia_black}] ${nf_tab_inactive} #I #[fg=${euphrasia_black},bg=${euphrasia_background}]${nf_pill_close}"
set -g window-status-current-format "#[fg=${euphrasia_bright_cyan},bg=${euphrasia_background}]${nf_pill_open}#[fg=${euphrasia_background},bg=${euphrasia_bright_cyan},bold] ${nf_tab_active} #I #[fg=${euphrasia_bright_cyan},bg=${euphrasia_background},nobold]${nf_pill_close}"
set -g window-status-separator " "
setw -g window-status-activity-style "fg=${euphrasia_bright_yellow},bg=${euphrasia_background},bold"
setw -g window-status-bell-style "fg=${euphrasia_bright_red},bg=${euphrasia_background},bold"

# Left: active window name in ANSI 0;35 and uppercased session name.
set -g @euphrasia_info_left "#[fg=${euphrasia_background},bg=${euphrasia_magenta},bold] ${nf_window} #W #[fg=${euphrasia_magenta},bg=${euphrasia_background},nobold]${nf_soft_right}  #[fg=${euphrasia_bright_black},bg=${euphrasia_background},bold]#{s/a/A/g;s/b/B/g;s/c/C/g;s/d/D/g;s/e/E/g;s/f/F/g;s/g/G/g;s/h/H/g;s/i/I/g;s/j/J/g;s/k/K/g;s/l/L/g;s/m/M/g;s/n/N/g;s/o/O/g;s/p/P/g;s/q/Q/g;s/r/R/g;s/s/S/g;s/t/T/g;s/u/U/g;s/v/V/g;s/w/W/g;s/x/X/g;s/y/Y/g;s/z/Z/g:session_name}"

# Right: optional prefix indicator and lowercase hostname.
set -g @euphrasia_info_right "#{prefix_highlight}#[fg=${euphrasia_hostname},bg=${euphrasia_background}]${nf_soft_left}${nf_pill_open}#[fg=${euphrasia_background},bg=${euphrasia_hostname},bold] ${nf_hostname} #(hostname | tr '[:upper:]' '[:lower:]')  "
