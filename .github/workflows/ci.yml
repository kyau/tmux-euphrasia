name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: ShellCheck and tmux smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install --yes shellcheck tmux

      - name: Run ShellCheck
        run: shellcheck tmux-euphrasia.tmux tests/smoke.sh

      - name: Run smoke test
        run: tests/smoke.sh
